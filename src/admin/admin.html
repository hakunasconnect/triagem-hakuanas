<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://wwfkazbjiutihtexqknm.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#263d30">
<title>Admin — Triagem Hakunas</title>
<style>
:root{--bg:#f4f6ef;--card:#fff;--ink:#17201a;--muted:#5d6a60;--line:#d9dfd3;--brand:#263d30;--accent:#f36c32;--ok:#2f7d4f;--warn:#c98a00;--bad:#c0392b;--black:#1b1b1b}
@media(prefers-color-scheme:dark){:root{--bg:#121714;--card:#1b231e;--ink:#eef2ea;--muted:#9fb0a4;--line:#2e3b33;--brand:#8fd0a8;--accent:#ff8a57;--black:#d9d9d9}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
header.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.kpi b{display:block;font-size:1.6rem;line-height:1.2}.kpi span{color:var(--muted);font-size:.85rem}
button,.btn{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}@media(prefers-color-scheme:dark){button.primary{color:#0e1511}}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;margin:10px 0 4px;font-weight:600}input{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.narrow{max-width:420px;margin:8vh auto}.err{color:var(--bad);min-height:1.4em}.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.scroll{overflow-x:auto}tr.click{cursor:pointer}tr.click:hover{background:rgba(127,127,127,.08)}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px}.bar{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;position:relative}.bar.t{background:var(--accent)}
.days{display:flex;gap:4px;font-size:.65rem;color:var(--muted)}.days span{flex:1;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin-top:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.colors{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:.78rem}
footer.dev-credit{max-width:1100px;margin:0 auto;padding:8px 16px 28px;text-align:center;font-size:.8rem;color:var(--muted)}footer.dev-credit a{color:inherit}
@media(max-width:600px){main{padding:12px}.hide-sm{display:none}}
</style>
</head>
<body>
<main id="app"><p class="muted">Carregando…</p></main>
<footer class="dev-credit">Desenvolvido por <strong>Dr. Edson Barroso</strong> · Hakuna nº 203460 · Instagram <a href="https://www.instagram.com/dredsonbarrosod/" target="_blank" rel="noopener noreferrer">@dredsonbarrosod</a></footer>
<script>/*__ADMIN_BUNDLE__*/</script>
</body>
</html>
